version: 2
updates:
  # Keeps the SHA-pinned actions in deploy.yml current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Dependencies are pinned to exact versions; group updates into one weekly PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ['*']
    commit-message:
      prefix: deps
